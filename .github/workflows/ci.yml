name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    name: Pruebas y checks de Django
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt
      - name: Pruebas (SQLite aislado)
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
          PYTHONDONTWRITEBYTECODE: "1"
        run: python manage.py test tests apps.accounts.tests --verbosity 2
      - name: Migraciones sin cambios pendientes
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
        run: python manage.py makemigrations --check --dry-run
      - name: check --deploy con valores sintéticos
        run: |
          export DJANGO_SECRET_KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(50))')"
          python manage.py check --deploy --fail-level WARNING
        env:
          DJANGO_SETTINGS_MODULE: config.settings.production
          DJANGO_ALLOWED_HOSTS: ci.example.test
          POSTGRES_DB: synthetic
          POSTGRES_USER: synthetic
          POSTGRES_PASSWORD: synthetic-only
          POSTGRES_HOST: localhost
