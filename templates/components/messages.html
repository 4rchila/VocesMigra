{% load i18n %}
{% if messages %}
<ul class="messages" role="list" aria-label="{% trans 'Mensajes' %}">
  {% for message in messages %}
  <li class="message message--{{ message.tags|default:'info' }}" role="{% if message.tags == 'error' %}alert{% else %}status{% endif %}">
    {{ message }}
  </li>
  {% endfor %}
</ul>
{% endif %}
